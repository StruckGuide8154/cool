name: Temp ZeroFIDO security-key build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZEROFIDO_PROFILE: full
      ZEROFIDO_RELEASE_DIAGNOSTICS: "0"
      ZEROFIDO_USB_DIAGNOSTICS: "0"
      ZEROFIDO_AUTO_ACCEPT_REQUESTS: "0"
      ZEROFIDO_DEV_SCREENSHOT: "0"
      ZEROFIDO_DEV_FIDO2_1: "0"
      ZEROFIDO_PACKED_ATTESTATION: "1"
      ZEROFIDO_SECURITY_KEY_ONLY: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          repository: MinorGlitch/zerofido
          ref: master
          path: zerofido

      - name: Patch ZeroFIDO
        working-directory: zerofido
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("application.fam")
          s = p.read_text()
          a = 'dev_fido2_1 = env_flag("ZEROFIDO_DEV_FIDO2_1", False)\npacked_attestation = env_flag("ZEROFIDO_PACKED_ATTESTATION", True)'
          b = 'dev_fido2_1 = env_flag("ZEROFIDO_DEV_FIDO2_1", False)\nsecurity_key_only = env_flag("ZEROFIDO_SECURITY_KEY_ONLY", False)\npacked_attestation = env_flag("ZEROFIDO_PACKED_ATTESTATION", True)'
          assert a in s
          s = s.replace(a, b, 1)
          a = '    f"ZF_DEV_FIDO2_1={1 if dev_fido2_1 else 0}",\n    f"ZF_PACKED_ATTESTATION={1 if packed_attestation else 0}",'
          b = '    f"ZF_DEV_FIDO2_1={1 if dev_fido2_1 else 0}",\n    f"ZF_SECURITY_KEY_ONLY={1 if security_key_only else 0}",\n    f"ZF_PACKED_ATTESTATION={1 if packed_attestation else 0}",'
          assert a in s
          p.write_text(s.replace(a, b, 1))

          p = Path("src/ctap/response.c")
          s = p.read_text()
          a = '        zf_cbor_encode_text(&enc, "rk") && zf_cbor_encode_bool(&enc, true) &&'
          b = '''#if defined(ZF_SECURITY_KEY_ONLY) && ZF_SECURITY_KEY_ONLY
        zf_cbor_encode_text(&enc, "rk") && zf_cbor_encode_bool(&enc, false) &&
#else
        zf_cbor_encode_text(&enc, "rk") && zf_cbor_encode_bool(&enc, true) &&
#endif'''
          assert a in s
          p.write_text(s.replace(a, b, 1))

          p = Path("src/ctap/commands/make_credential.c")
          s = p.read_text()
          a = '    resident_key = scratch->request.has_rk && scratch->request.rk;'
          b = '''    resident_key = scratch->request.has_rk && scratch->request.rk;
#if defined(ZF_SECURITY_KEY_ONLY) && ZF_SECURITY_KEY_ONLY
    if (resident_key) {
        status = ZF_CTAP_ERR_UNSUPPORTED_OPTION;
        goto cleanup;
    }
#endif'''
          assert a in s
          p.write_text(s.replace(a, b, 1))
          PY

      - name: Install uFBT
        run: python3 -m pip install --user ufbt==0.2.6

      - name: Build full USB + NFC FAP
        working-directory: zerofido
        run: python3 -m ufbt

      - name: Copy artifact
        working-directory: zerofido
        run: |
          cp dist/zerofido.fap dist/zerofido-security-key-full.fap
          sha256sum dist/zerofido-security-key-full.fap > dist/SHA256SUMS-security-key.txt

      - uses: actions/upload-artifact@v4
        with:
          name: zerofido-security-key-full
          path: |
            zerofido/dist/zerofido-security-key-full.fap
            zerofido/dist/SHA256SUMS-security-key.txt
