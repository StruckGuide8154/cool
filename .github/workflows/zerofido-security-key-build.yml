name: Build ZeroFIDO security-key mode

on:
  push:
    branches:
      - chatgpt/zerofido-security-key-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"
      ZEROFIDO_PROFILE: "full"
      ZEROFIDO_RELEASE_DIAGNOSTICS: "0"
      ZEROFIDO_USB_DIAGNOSTICS: "0"
      ZEROFIDO_AUTO_ACCEPT_REQUESTS: "0"
      ZEROFIDO_DEV_SCREENSHOT: "0"
      ZEROFIDO_DEV_FIDO2_1: "0"
      ZEROFIDO_PACKED_ATTESTATION: "1"
      ZEROFIDO_SECURITY_KEY_ONLY: "1"

    steps:
      - name: Check out ZeroFIDO
        uses: actions/checkout@v6.0.2
        with:
          repository: MinorGlitch/zerofido
          ref: master
          path: zerofido

      - name: Apply security-key-only changes
        working-directory: zerofido
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fam = Path("application.fam")
          s = fam.read_text()
          old = 'dev_fido2_1 = env_flag("ZEROFIDO_DEV_FIDO2_1", False)\npacked_attestation = env_flag("ZEROFIDO_PACKED_ATTESTATION", True)'
          new = 'dev_fido2_1 = env_flag("ZEROFIDO_DEV_FIDO2_1", False)\nsecurity_key_only = env_flag("ZEROFIDO_SECURITY_KEY_ONLY", False)\npacked_attestation = env_flag("ZEROFIDO_PACKED_ATTESTATION", True)'
          assert old in s
          fam.write_text(s.replace(old, new, 1))

          fam = Path("application.fam")
          s = fam.read_text()
          old = '    f"ZF_DEV_FIDO2_1={1 if dev_fido2_1 else 0}",\n    f"ZF_PACKED_ATTESTATION={1 if packed_attestation else 0}",'
          new = '    f"ZF_DEV_FIDO2_1={1 if dev_fido2_1 else 0}",\n    f"ZF_SECURITY_KEY_ONLY={1 if security_key_only else 0}",\n    f"ZF_PACKED_ATTESTATION={1 if packed_attestation else 0}",'
          assert old in s
          fam.write_text(s.replace(old, new, 1))

          p = Path("src/ctap/response.c")
          s = p.read_text()
          old = '        zf_cbor_encode_text(&enc, "rk") && zf_cbor_encode_bool(&enc, true) &&'
          new = '''#if defined(ZF_SECURITY_KEY_ONLY) && ZF_SECURITY_KEY_ONLY
          zf_cbor_encode_text(&enc, "rk") && zf_cbor_encode_bool(&enc, false) &&
          #else
          zf_cbor_encode_text(&enc, "rk") && zf_cbor_encode_bool(&enc, true) &&
          #endif'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/ctap/commands/make_credential.c")
          s = p.read_text()
          old = '    resident_key = scratch->request.has_rk && scratch->request.rk;'
          new = '''    resident_key = scratch->request.has_rk && scratch->request.rk;
          #if defined(ZF_SECURITY_KEY_ONLY) && ZF_SECURITY_KEY_ONLY
              if (resident_key) {
                  status = ZF_CTAP_ERR_UNSUPPORTED_OPTION;
                  goto cleanup;
              }
          #endif'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: zerofido/uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Sync tools
        working-directory: zerofido
        run: uv sync --locked

      - name: Build
        working-directory: zerofido
        run: uv run python -m ufbt

      - name: Package release FAP
        working-directory: zerofido
        run: uv run python host_tools/package_release.py --skip-build --allow-prebuilt-input --fap dist/zerofido.fap --output-fap dist/zerofido-security-key-full.fap

      - name: Hash
        working-directory: zerofido
        run: sha256sum dist/zerofido-security-key-full.fap > dist/SHA256SUMS-security-key.txt

      - name: Upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zerofido-security-key-full
          if-no-files-found: error
          path: |
            zerofido/dist/zerofido-security-key-full.fap
            zerofido/dist/SHA256SUMS-security-key.txt
